body:
  text: 録文四每月十齊日月一日童子下此日齊者不墮鐵樹地獄八日太子下此日齊者不墮鐵犁地獄十四日司命下此日齊者不墮鑊湯地獄十五日五道大神下此日齊者不墮鋸解地獄十八日閻羅王下此日齊者不墮糞屎地獄二十三日天大將軍下此日齊者不墮銅柱地獄二十四日察命下此日齊者不墮黑暗地獄二十八日太山府君下此日齊者不墮鐵床地獄二十九日四天王下此日齊者不墮鐵鈸地獄三十日梵天王下此日齊者不墮鐵輪地獄録文完
